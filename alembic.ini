# Used by `uv run alembic ...`. The URL comes from ELYSIUM_DATABASE_URL (see env.py)
# unless overridden with `-x`/sqlalchemy.url. Prefer `elysium-bot db upgrade`.
[alembic]
script_location = elysium_bot:migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
