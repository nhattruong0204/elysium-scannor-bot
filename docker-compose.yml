# Usage: cp .env.example .env && edit, then: mkdir -p data && sudo chown 10001:10001 data
#        docker compose up -d --build
# Optional PostgreSQL: docker compose --profile postgres up -d  (and point ELYSIUM_DATABASE_URL at db)
services:
  bot:
    build: .
    image: ghcr.io/nhattruong0204/elysium-scannor-bot:latest
    env_file: .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "elysium-bot", "healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: elysium
      POSTGRES_USER: elysium
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elysium -d elysium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
